# beat-keepalive — the SECOND observer, made self-chaining (wave-19.13)
#
# Two-plane law (wave-19.10-f/19.13): this lane is runner-kit's keepalive
# ported with ONE adapted line (SELF_REPO) — identical script, self-scoped
# handoff. THE DWELL-CHAIN LAW (wave-19.11, CI-proven on runner-kit runs
# #8->#12): one run dwells inside the runner (3 staleness checks, 15min apart
# = ~30min of continuous cover), then hands the chain to ONE successor
# (dispatched only if the newest keepalive run is this run — a schedule win
# during the dwell is newer and carries the chain instead; no splitting).
# ONE lottery win per hour now sustains a continuous 15-minute heart-watch;
# the */20 schedule (decorrelated from runner-kit's */15) is demoted to
# bootstrap. Two independent continuous watchers now guard the same heart:
# runner-kit's chain + this one — either alone suffices, together they are
# redundancy against a repo-level switch flip on either plane.
#
# SECRET-SURFACE LAW: schedule + workflow_dispatch ONLY — a pull_request
# trigger is FORBIDDEN in any lane that touches SOVEREIGN_PAT.
# FAIL-CLOSED: missing credential, API error, or a failed handoff reddens
# this lane honestly (exit 1) — the chain dies loudly, never silently.

name: beat-keepalive

on:
  schedule:
    - cron: '*/20 * * * *'   # decorrelated bootstrap ticket (re-seeds the chain after any outage)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beat-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 3 dwell cycles (2 x 15min sleep) + checkout + API headroom
    steps:
      - uses: actions/checkout@v4

      - name: Keepalive (dwell-chain law — check x3 @15min, wake if stale, hand the chain to one successor)
        env:
          SOVEREIGN_PAT: ${{ secrets.SOVEREIGN_PAT }}
          # GITHUB_RUN_ID needs NO mapping — it is a default env var present on
          # every step; the handoff gate reads it from the environment.
          # (wave-19.11 lesson carried over: NO unquoted colon-space in this
          # name — it rejects the whole file; yml parsed locally before push.)
        run: python3 scripts/beat-keepalive.py
